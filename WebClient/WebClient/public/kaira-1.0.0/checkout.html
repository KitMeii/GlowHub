<!doctype html>
<html lang="vi">
  <head>
    <title>Thanh Toán & Tài Khoản — GlowHub</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Marcellus&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/glowhub-theme.css" />

    <style>
      .gh-pm__option {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--gh-border);
        border-radius: var(--gh-radius);
        cursor: pointer;
        margin-bottom: 8px;
        transition: all .2s;
      }
      .gh-pm__option:hover { border-color: var(--gh-primary); }
      .gh-pm__option input[type=radio] {
        accent-color: var(--gh-primary);
        margin: 0;
      }
      .gh-pm__option:has(input:checked) {
        border-color: var(--gh-primary);
        background: var(--gh-primary-soft);
      }
      .gh-pm__icon {
        width: 40px; height: 40px;
        background: var(--gh-surface);
        border-radius: var(--gh-radius-sm);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }
      .gh-order-row {
        cursor: pointer;
        transition: background .2s;
      }
      .gh-order-row:hover { background: var(--gh-surface); }
      .gh-order-row td { padding: 14px 12px; font-size: 14px; }
      .gh-account-form .gh-input,
      .gh-account-form .gh-textarea {
        margin-bottom: var(--gh-s3);
      }
    </style>
  </head>

  <body>
    <div id="gh-layout-header"></div>

    <header class="gh-page-header">
      <div class="container">
        <div class="gh-breadcrumb"><a href="index.html">Trang Chủ</a><span class="sep">/</span><span id="bc-current">Thanh Toán</span></div>
        <h1 id="page-title">Thanh Toán</h1>
      </div>
    </header>

    <main class="gh-section">
      <div class="container">
        <ul class="gh-tabs" role="tablist">
          <li><button class="gh-tabs__btn active" data-tab="checkout">🛒 Thanh Toán</button></li>
          <li><button class="gh-tabs__btn" data-tab="orders">📦 Đơn Hàng Của Tôi</button></li>
          <li><button class="gh-tabs__btn" data-tab="account">👤 Tài Khoản</button></li>
        </ul>

        <!-- ========== TAB CHECKOUT ========== -->
        <section id="tab-checkout" class="gh-tab-panel">
          <div id="checkout-empty" class="gh-empty-state" style="display:none">
            <div class="gh-empty-state__icon">🛒</div>
            <div class="gh-empty-state__title">Giỏ hàng đang trống</div>
            <a href="shop.html" class="gh-btn gh-btn--primary gh-mt-s3">Đi Đến Cửa Hàng</a>
          </div>

          <div class="row g-5" id="checkout-body">
            <!-- LEFT: form -->
            <div class="col-lg-7">
              <div class="gh-card">
                <h3 class="gh-card__title">Thông Tin Nhận Hàng</h3>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="gh-label">Họ và tên *</label>
                    <input id="co-name" class="gh-input" required />
                  </div>
                  <div class="col-md-6">
                    <label class="gh-label">Số điện thoại *</label>
                    <input id="co-phone" class="gh-input" required />
                  </div>
                  <div class="col-12">
                    <label class="gh-label">Email</label>
                    <input id="co-email" type="email" class="gh-input" />
                  </div>
                  <div class="col-12">
                    <label class="gh-label">Địa chỉ giao hàng *</label>
                    <textarea id="co-address" class="gh-textarea" required placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành"></textarea>
                  </div>
                  <div class="col-12">
                    <label class="gh-label">Ghi chú (tùy chọn)</label>
                    <textarea id="co-note" class="gh-textarea" placeholder="Ghi chú thêm cho người giao hàng..."></textarea>
                  </div>
                </div>
              </div>

              <div class="gh-card gh-mt-s4">
                <h3 class="gh-card__title">Phương Thức Thanh Toán</h3>
                <label class="gh-pm__option">
                  <input type="radio" name="payment" value="COD" checked />
                  <span class="gh-pm__icon">💵</span>
                  <div>
                    <div style="font-weight:600">Thanh Toán Khi Nhận Hàng (COD)</div>
                    <small class="gh-text-muted">Thanh toán bằng tiền mặt khi nhận hàng</small>
                  </div>
                </label>
                <label class="gh-pm__option">
                  <input type="radio" name="payment" value="BANK" />
                  <span class="gh-pm__icon">🏦</span>
                  <div>
                    <div style="font-weight:600">Chuyển Khoản Ngân Hàng</div>
                    <small class="gh-text-muted">Chuyển khoản qua ngân hàng</small>
                  </div>
                </label>
                <label class="gh-pm__option">
                  <input type="radio" name="payment" value="MOMO" />
                  <span class="gh-pm__icon">🟣</span>
                  <div>
                    <div style="font-weight:600">Ví MoMo</div>
                    <small class="gh-text-muted">Thanh toán qua ví điện tử MoMo</small>
                  </div>
                </label>
                <label class="gh-pm__option">
                  <input type="radio" name="payment" value="VNPAY" />
                  <span class="gh-pm__icon">💳</span>
                  <div>
                    <div style="font-weight:600">VNPay</div>
                    <small class="gh-text-muted">Thanh toán qua cổng VNPay</small>
                  </div>
                </label>
              </div>
            </div>

            <!-- RIGHT: summary -->
            <div class="col-lg-5">
              <div class="gh-card" style="position:sticky;top:96px">
                <h3 class="gh-card__title">Đơn Hàng Của Bạn</h3>
                <div id="checkout-items"></div>

                <hr/>
                <div class="d-flex justify-content-between mb-2"><span class="gh-text-muted">Tạm tính</span><span id="co-subtotal">0 ₫</span></div>
                <div class="d-flex justify-content-between mb-2" id="co-discount-row" style="display:none"><span class="gh-text-muted">Giảm giá</span><span class="gh-text-danger" id="co-discount">0 ₫</span></div>
                <div class="d-flex justify-content-between mb-2"><span class="gh-text-muted">Phí vận chuyển</span><span id="co-ship">30.000 ₫</span></div>
                <hr/>
                <div class="d-flex justify-content-between" style="font-size:18px"><b>Tổng cộng</b><b class="gh-text-primary" id="co-total">0 ₫</b></div>

                <hr/>
                <label class="gh-label">Mã giảm giá</label>
                <div class="d-flex gap-2">
                  <input id="co-voucher" class="gh-input" placeholder="Nhập mã" />
                  <button class="gh-btn gh-btn--outline gh-btn--sm" id="co-apply-voucher">Áp Dụng</button>
                </div>
                <div id="co-voucher-msg" class="mt-2" style="font-size:13px"></div>

                <button id="place-order-btn" class="gh-btn gh-btn--primary gh-btn--block gh-btn--lg gh-mt-s5">Đặt Hàng Ngay</button>
              </div>
            </div>
          </div>
        </section>

        <!-- ========== TAB ORDERS ========== -->
        <section id="tab-orders" class="gh-tab-panel" style="display:none">
          <div class="gh-card">
            <h3 class="gh-card__title">Đơn Hàng Của Tôi</h3>
            <div id="orders-list-host">
              <div class="text-center text-muted py-4">Đang tải...</div>
            </div>
          </div>
        </section>

        <!-- ========== TAB ACCOUNT ========== -->
        <section id="tab-account" class="gh-tab-panel" style="display:none">
          <div class="row g-4">
            <div class="col-lg-7">
              <div class="gh-card gh-account-form">
                <h3 class="gh-card__title">Thông Tin Cá Nhân</h3>
                <label class="gh-label">Tài khoản</label>
                <input id="acc-username" class="gh-input" readonly />
                <label class="gh-label">Họ và tên</label>
                <input id="acc-name" class="gh-input" />
                <label class="gh-label">Email</label>
                <input id="acc-email" type="email" class="gh-input" />
                <label class="gh-label">Số điện thoại</label>
                <input id="acc-phone" class="gh-input" />
                <button class="gh-btn gh-btn--primary" id="save-account-btn">Lưu Thay Đổi</button>
              </div>
            </div>
            <div class="col-lg-5">
              <div class="gh-card gh-account-form">
                <h3 class="gh-card__title">Đổi Mật Khẩu</h3>
                <label class="gh-label">Mật khẩu hiện tại</label>
                <input id="pw-old" type="password" class="gh-input" />
                <label class="gh-label">Mật khẩu mới</label>
                <input id="pw-new" type="password" class="gh-input" />
                <label class="gh-label">Xác nhận mật khẩu mới</label>
                <input id="pw-confirm" type="password" class="gh-input" />
                <button class="gh-btn gh-btn--outline" id="change-password-btn">Đổi Mật Khẩu</button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- Order detail modal -->
    <div class="modal fade" id="orderDetailModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title gh-brand" style="font-size:1.1rem">Chi Tiết Đơn Hàng</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="order-detail-body">
            Đang tải...
          </div>
        </div>
      </div>
    </div>

    <div id="gh-layout-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>

    <script>
      const VOUCHER_KEY = 'gh_voucher';
      let SHIP_FEE = 30000;
      let coVoucher = null;
      let coItems = [];

      function _extractList(res) {
        if (!res) return [];
        if (Array.isArray(res)) return res;
        if (Array.isArray(res.items)) return res.items;
        if (Array.isArray(res.data)) return res.data;
        return [];
      }

      function _statusLabel(s) {
        const map = {
          PENDING:   ['Chờ xác nhận',  'pending'],
          CONFIRMED: ['Đã xác nhận',   'confirmed'],
          SHIPPING:  ['Đang giao',     'shipping'],
          COMPLETED: ['Hoàn thành',    'completed'],
          CANCELLED: ['Đã hủy',        'cancelled'],
        };
        const [label, cls] = map[String(s || '').toUpperCase()] || [s || '—', ''];
        return `<span class="gh-status-pill gh-status-pill--${cls}">${label}</span>`;
      }

      async function loadShippingFee() {
        try {
          const settings = await SiteSettings.getAll('shipping');
          const list = _extractList(settings);
          const fee = list.find(s => (s.Key || s.key) === 'default_fee');
          if (fee) SHIP_FEE = parseInt(fee.Value || fee.value) || SHIP_FEE;
        } catch (_) {}
      }

      // ========== CHECKOUT TAB ==========
      async function renderCheckout() {
        coItems = await Cart.getItemsAsync();
        const host = document.getElementById('checkout-items');

        if (!coItems.length) {
          document.getElementById('checkout-body').style.display = 'none';
          document.getElementById('checkout-empty').style.display = 'block';
          return;
        }
        document.getElementById('checkout-body').style.display = '';
        document.getElementById('checkout-empty').style.display = 'none';

        host.innerHTML = coItems.map(i => {
          return `
            <div class="d-flex gap-2 align-items-center mb-2">
              <img src="${i.image || ''}" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:4px;background:var(--gh-surface)" onerror="this.style.visibility='hidden'"/>
              <div class="flex-grow-1" style="font-size:13px">
                <div style="font-weight:500">${(i.name || '').slice(0, 40)}</div>
                <small class="gh-text-muted">${i.qty} × ${_fmtMoney(i.price)}</small>
              </div>
              <div style="font-weight:600">${_fmtMoney(i.qty * i.price)}</div>
            </div>
          `;
        }).join('');

        recalc();
      }

      function recalc() {
        const subtotal = coItems.reduce((s, i) => s + i.price * i.qty, 0);
        const discount = coVoucher ? Math.min(coVoucher.discount || 0, subtotal) : 0;
        const ship = coItems.length ? SHIP_FEE : 0;
        const total = Math.max(0, subtotal - discount + ship);

        document.getElementById('co-subtotal').textContent = _fmtMoney(subtotal);
        document.getElementById('co-ship').textContent = _fmtMoney(ship);
        document.getElementById('co-total').textContent = _fmtMoney(total);
        const dRow = document.getElementById('co-discount-row');
        if (discount > 0) {
          dRow.style.display = '';
          document.getElementById('co-discount').textContent = '− ' + _fmtMoney(discount);
        } else {
          dRow.style.display = 'none';
        }
      }

      async function applyCoVoucher() {
        const code = document.getElementById('co-voucher').value.trim().toUpperCase();
        const msgEl = document.getElementById('co-voucher-msg');
        if (!code) return;
        const subtotal = coItems.reduce((s, i) => s + i.price * i.qty, 0);
        try {
          const r = await Voucher.validate(code, subtotal);
          if (r && (r.valid || r.Valid)) {
            coVoucher = { code, discount: r.discountAmount || r.DiscountAmount || 0 };
            localStorage.setItem(VOUCHER_KEY, JSON.stringify(coVoucher));
            msgEl.style.color = 'var(--gh-success)';
            msgEl.textContent = r.message || 'Áp dụng thành công!';
            recalc();
          } else {
            coVoucher = null;
            localStorage.removeItem(VOUCHER_KEY);
            msgEl.style.color = 'var(--gh-danger)';
            msgEl.textContent = r?.message || r?.Message || 'Mã không hợp lệ';
            recalc();
          }
        } catch (err) {
          msgEl.style.color = 'var(--gh-danger)';
          msgEl.textContent = err.message || 'Lỗi kiểm tra mã';
        }
      }

      async function preFillCheckout() {
        try {
          const me = await Account.getMe();
          document.getElementById('co-name').value  = me.Name || me.name || '';
          document.getElementById('co-email').value = me.Email || me.email || '';
          document.getElementById('co-phone').value = me.Phone || me.phone || '';
        } catch (_) {}
      }

      async function placeOrder() {
        const name    = document.getElementById('co-name').value.trim();
        const phone   = document.getElementById('co-phone').value.trim();
        const email   = document.getElementById('co-email').value.trim();
        const address = document.getElementById('co-address').value.trim();
        const note    = document.getElementById('co-note').value.trim();
        const payment = document.querySelector('input[name=payment]:checked').value;

        if (!name || !phone || !address) {
          showGlobalToast('Vui lòng nhập đủ họ tên, SĐT và địa chỉ', 'error');
          return;
        }
        if (!coItems.length) {
          showGlobalToast('Giỏ hàng đang trống', 'error');
          return;
        }

        const btn = document.getElementById('place-order-btn');
        btn.disabled = true;
        btn.textContent = 'Đang xử lý...';

        try {
          await Order.checkout({
            ShippingAddress: address,
            Note: note,
            CustomerName: name,
            CustomerEmail: email,
            CustomerPhone: phone,
            ShippingFee: SHIP_FEE,
            PaymentMethod: payment,
            VoucherCode: coVoucher ? coVoucher.code : null,
          });
          await Cart.clear();
          coVoucher = null;
          localStorage.removeItem(VOUCHER_KEY);
          showGlobalToast('Đặt hàng thành công!');
          setTimeout(() => switchTab('orders'), 600);
        } catch (err) {
          showGlobalToast(err.message || 'Đặt hàng thất bại', 'error');
          btn.disabled = false;
          btn.textContent = 'Đặt Hàng Ngay';
        }
      }

      // ========== ORDERS TAB ==========
      async function renderOrders() {
        const host = document.getElementById('orders-list-host');
        host.innerHTML = '<div class="text-center text-muted py-4">Đang tải...</div>';
        let list = [];
        try { list = await Account.myOrders(); } catch (err) {
          host.innerHTML = `<div class="gh-empty-state">Lỗi: ${err.message}</div>`;
          return;
        }
        list = _extractList(list);

        if (!list.length) {
          host.innerHTML = `<div class="gh-empty-state"><div class="gh-empty-state__icon">📦</div><div class="gh-empty-state__title">Chưa có đơn hàng nào</div><a href="shop.html" class="gh-btn gh-btn--primary gh-mt-s3">Bắt Đầu Mua Sắm</a></div>`;
          return;
        }

        host.innerHTML = `
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--gh-text-muted)">
                  <th>Mã đơn</th>
                  <th>Ngày đặt</th>
                  <th>Tổng tiền</th>
                  <th>Trạng thái</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${list.map(o => {
                  const id   = o.Id || o.id;
                  const date = o.OrderDate || o.orderDate;
                  const dateStr = date ? new Date(date).toLocaleString('vi-VN') : '—';
                  const total = o.TotalAmount || o.totalAmount || 0;
                  const status = o.Status || o.status;
                  return `
                    <tr class="gh-order-row" data-order-id="${id}">
                      <td><b>#${id}</b></td>
                      <td>${dateStr}</td>
                      <td><b>${_fmtMoney(total)}</b></td>
                      <td>${_statusLabel(status)}</td>
                      <td><button class="gh-btn gh-btn--ghost gh-btn--sm">Xem →</button></td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;

        host.querySelectorAll('.gh-order-row').forEach(tr => {
          tr.addEventListener('click', () => openOrderDetail(tr.dataset.orderId));
        });
      }

      async function openOrderDetail(orderId) {
        const body = document.getElementById('order-detail-body');
        body.innerHTML = '<div class="text-center text-muted py-4">Đang tải...</div>';
        const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('orderDetailModal'));
        modal.show();

        try {
          const [order, logs] = await Promise.all([
            Account.orderDetail(orderId),
            Account.orderStatusLogs(orderId).catch(() => []),
          ]);
          const details = _extractList(order.OrderDetails || order.orderDetails || order.Details);
          const status  = order.Status || order.status;
          const date    = order.OrderDate || order.orderDate;
          const dateStr = date ? new Date(date).toLocaleString('vi-VN') : '—';

          body.innerHTML = `
            <div class="d-flex justify-content-between flex-wrap gap-2 mb-3">
              <div>
                <div class="gh-text-muted" style="font-size:12px">MÃ ĐƠN</div>
                <h4 style="font-family:var(--gh-font-display);margin:0">#${order.Id || order.id}</h4>
              </div>
              <div class="text-end">
                <div class="gh-text-muted" style="font-size:12px">TRẠNG THÁI</div>
                ${_statusLabel(status)}
              </div>
            </div>

            <div class="row g-3 mb-3" style="font-size:13px">
              <div class="col-md-6"><b>Người nhận:</b> ${order.CustomerName || order.customerName || '—'}</div>
              <div class="col-md-6"><b>SĐT:</b> ${order.CustomerPhone || order.customerPhone || '—'}</div>
              <div class="col-md-12"><b>Địa chỉ:</b> ${order.ShippingAddress || order.shippingAddress || '—'}</div>
              <div class="col-md-6"><b>Ngày đặt:</b> ${dateStr}</div>
              <div class="col-md-6"><b>Thanh toán:</b> ${order.PaymentMethod || order.paymentMethod || 'COD'}</div>
              ${(order.Note || order.note) ? `<div class="col-12"><b>Ghi chú:</b> ${order.Note || order.note}</div>` : ''}
            </div>

            <h6 class="gh-card__title" style="font-size:13px">Sản Phẩm</h6>
            <div class="table-responsive">
              <table class="table table-sm">
                <thead><tr><th>Sản phẩm</th><th>SL</th><th>Đơn giá</th><th class="text-end">Thành tiền</th></tr></thead>
                <tbody>
                  ${details.map(d => {
                    const pname = d.ProductName || d.productName || ('SP #' + (d.ProductId || d.productId));
                    const qty   = d.Quantity || d.quantity || 0;
                    const unit  = d.UnitPrice || d.unitPrice || 0;
                    return `<tr><td>${pname}</td><td>${qty}</td><td>${_fmtMoney(unit)}</td><td class="text-end"><b>${_fmtMoney(qty * unit)}</b></td></tr>`;
                  }).join('')}
                </tbody>
                <tfoot>
                  <tr><td colspan="3" class="text-end gh-text-muted">Phí vận chuyển</td><td class="text-end">${_fmtMoney(order.ShippingFee || order.shippingFee || 0)}</td></tr>
                  ${(order.DiscountAmount || order.discountAmount) ? `<tr><td colspan="3" class="text-end gh-text-muted">Giảm giá (${order.VoucherCode || ''})</td><td class="text-end gh-text-danger">− ${_fmtMoney(order.DiscountAmount || order.discountAmount)}</td></tr>` : ''}
                  <tr><td colspan="3" class="text-end"><b>TỔNG CỘNG</b></td><td class="text-end"><b class="gh-text-primary" style="font-size:18px">${_fmtMoney(order.TotalAmount || order.totalAmount || 0)}</b></td></tr>
                </tfoot>
              </table>
            </div>

            <h6 class="gh-card__title gh-mt-s5" style="font-size:13px">Lịch Sử Trạng Thái</h6>
            ${renderTimeline(_extractList(logs))}

            ${String(status || '').toUpperCase() === 'PENDING'
              ? `<div class="text-end gh-mt-s4"><button class="gh-btn gh-btn--outline gh-text-danger" id="cancel-order-btn" data-id="${order.Id || order.id}">Hủy Đơn Hàng</button></div>`
              : ''
            }
          `;

          const cancelBtn = document.getElementById('cancel-order-btn');
          if (cancelBtn) {
            cancelBtn.addEventListener('click', async () => {
              const note = prompt('Lý do hủy đơn (tùy chọn):') || '';
              try {
                await Account.cancelMyOrder(cancelBtn.dataset.id, note);
                showGlobalToast('Đã hủy đơn hàng');
                modal.hide();
                renderOrders();
              } catch (err) {
                showGlobalToast(err.message || 'Không hủy được', 'error');
              }
            });
          }
        } catch (err) {
          body.innerHTML = `<div class="gh-empty-state">Lỗi: ${err.message}</div>`;
        }
      }

      function renderTimeline(logs) {
        if (!logs.length) return `<p class="gh-text-muted" style="font-size:13px">Chưa có lịch sử.</p>`;
        return `
          <ul class="gh-timeline">
            ${logs.map(l => {
              const dt = l.CreatedAt || l.createdAt;
              const when = dt ? new Date(dt).toLocaleString('vi-VN') : '';
              const newStatus = l.NewStatus || l.newStatus;
              const oldStatus = l.OldStatus || l.oldStatus;
              const note = l.Note || l.note;
              const by   = l.ChangedBy || l.changedBy;
              return `
                <li>
                  <div class="gh-timeline__when">${when}</div>
                  <div class="gh-timeline__what">${oldStatus ? `${oldStatus} →` : ''} ${newStatus}</div>
                  ${by ? `<div class="gh-timeline__when">Bởi: ${by}</div>` : ''}
                  ${note ? `<div class="gh-timeline__note">"${note}"</div>` : ''}
                </li>
              `;
            }).join('')}
          </ul>
        `;
      }

      // ========== ACCOUNT TAB ==========
      async function renderAccount() {
        try {
          const me = await Account.getMe();
          document.getElementById('acc-username').value = me.UserName || me.userName || '';
          document.getElementById('acc-name').value     = me.Name || me.name || '';
          document.getElementById('acc-email').value    = me.Email || me.email || '';
          document.getElementById('acc-phone').value    = me.Phone || me.phone || '';
        } catch (_) {}
      }

      async function saveAccount() {
        try {
          await Account.updateMe({
            Name:  document.getElementById('acc-name').value.trim(),
            Email: document.getElementById('acc-email').value.trim(),
            Phone: document.getElementById('acc-phone').value.trim(),
          });
          showGlobalToast('Đã cập nhật thông tin');
        } catch (err) {
          showGlobalToast(err.message || 'Lỗi cập nhật', 'error');
        }
      }

      async function changePassword() {
        const oldP = document.getElementById('pw-old').value;
        const newP = document.getElementById('pw-new').value;
        const cf   = document.getElementById('pw-confirm').value;
        if (!oldP || !newP) { showGlobalToast('Vui lòng nhập đủ mật khẩu', 'error'); return; }
        if (newP !== cf)    { showGlobalToast('Mật khẩu mới không khớp', 'error'); return; }
        try {
          await Account.changePassword({ OldPassword: oldP, NewPassword: newP });
          showGlobalToast('Đã đổi mật khẩu');
          document.getElementById('pw-old').value = '';
          document.getElementById('pw-new').value = '';
          document.getElementById('pw-confirm').value = '';
        } catch (err) {
          showGlobalToast(err.message || 'Lỗi đổi mật khẩu', 'error');
        }
      }

      // ========== TAB SWITCHING ==========
      const TAB_TITLES = {
        checkout: ['Thanh Toán', 'Thanh Toán'],
        orders:   ['Đơn Hàng Của Tôi', 'Đơn Hàng'],
        account:  ['Tài Khoản', 'Tài Khoản'],
      };

      function switchTab(tab) {
        ['checkout', 'orders', 'account'].forEach(t => {
          document.getElementById(`tab-${t}`).style.display = (t === tab ? 'block' : 'none');
        });
        document.querySelectorAll('.gh-tabs__btn').forEach(b => {
          b.classList.toggle('active', b.dataset.tab === tab);
        });
        const [title, bc] = TAB_TITLES[tab] || ['', ''];
        document.getElementById('page-title').textContent = title;
        document.getElementById('bc-current').textContent = bc;
        if (location.hash !== `#${tab}`) history.replaceState({}, '', `#${tab}`);

        if (tab === 'orders')  renderOrders();
        if (tab === 'account') renderAccount();
      }

      document.addEventListener('DOMContentLoaded', async () => {
        if (!requireLogin('checkout.html')) return;
        mountLayout({ active: 'account' });
        await loadShippingFee();

        // Restore voucher
        try {
          const v = JSON.parse(localStorage.getItem(VOUCHER_KEY) || 'null');
          if (v && v.code) coVoucher = v;
        } catch (_) {}

        await renderCheckout();
        await preFillCheckout();

        if (coVoucher) {
          document.getElementById('co-voucher').value = coVoucher.code;
          recalc();
        }

        document.querySelectorAll('.gh-tabs__btn').forEach(b => {
          b.addEventListener('click', () => switchTab(b.dataset.tab));
        });

        document.getElementById('place-order-btn').addEventListener('click', placeOrder);
        document.getElementById('co-apply-voucher').addEventListener('click', applyCoVoucher);
        document.getElementById('co-voucher').addEventListener('keydown', e => { if (e.key === 'Enter') applyCoVoucher(); });

        document.getElementById('save-account-btn').addEventListener('click', saveAccount);
        document.getElementById('change-password-btn').addEventListener('click', changePassword);

        // Initial tab from hash
        const initial = (location.hash || '').replace('#', '');
        if (['checkout', 'orders', 'account'].includes(initial)) switchTab(initial);
      });
    </script>
  </body>
</html>
