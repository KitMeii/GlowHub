<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanh Toán Thất Bại — GlowHub</title>
  <meta name="robots" content="noindex" />
  <link rel="dns-prefetch" href="//cdn.jsdelivr.net" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400;500;700&family=Marcellus&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="css/tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body,'Jost',sans-serif); background: var(--cream,#f8f5f0); min-height: 100vh; display: flex; flex-direction: column; color: var(--dark,#111); }
    .gh-topbar { background: var(--dark,#111); color: rgba(255,255,255,.65); text-align: center; padding: 7px 20px; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }
    .gh-nav { background: #fff; border-bottom: 1px solid #e2ddd8; padding: 0 40px; height: 60px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
    .gh-logo { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; letter-spacing: 7px; text-transform: uppercase; color: var(--dark,#111); text-decoration: none; text-align: center; }
    .gh-nav-link { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #555; text-decoration: none; transition: color .2s; }
    .gh-nav-link:hover { color: var(--pink,#f759ab); }

    .page-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 20px; }
    .result-card { background: #fff; border: 1px solid #e2ddd8; max-width: 520px; width: 100%; padding: 56px 48px; text-align: center; }
    .result-icon { width: 80px; height: 80px; border-radius: 50%; background: #fef2f2; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 36px; color: #ef4444; }
    .result-eyebrow { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; color: #888; margin-bottom: 12px; }
    .result-title { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 300; letter-spacing: 2px; margin-bottom: 12px; }
    .result-sub { font-size: 12px; color: #888; letter-spacing: .5px; line-height: 1.8; margin-bottom: 32px; }

    .order-info { background: #fafaf8; border: 1px solid #e2ddd8; padding: 16px 20px; margin-bottom: 32px; text-align: left; }
    .order-info-row { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; border-bottom: 1px dashed #eee; }
    .order-info-row:last-child { border-bottom: none; }
    .order-info-row .lbl { color: #888; }
    .order-info-row .val { font-weight: 600; }

    .reason-box { background: #fef2f2; border: 1px solid #fca5a5; border-radius: 6px; padding: 12px 16px; margin-bottom: 28px; font-size: 12px; color: #991b1b; text-align: left; }
    .reason-box i { margin-right: 6px; }

    .actions { display: flex; flex-direction: column; gap: 12px; }
    .btn-primary { display: block; padding: 16px; background: var(--dark,#111); color: #fff; border: none; font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; transition: background .3s; text-decoration: none; text-align: center; }
    .btn-primary:hover { background: var(--pink,#f759ab); color: #fff; }
    .btn-outline { display: block; padding: 14px; background: transparent; color: var(--dark,#111); border: 1px solid #e2ddd8; font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; transition: all .3s; text-decoration: none; text-align: center; }
    .btn-outline:hover { background: var(--dark,#111); color: #fff; border-color: var(--dark,#111); }
    .btn-link { font-size: 11px; color: #888; letter-spacing: 1px; text-decoration: none; }
    .btn-link:hover { color: var(--dark,#111); }

    @media (max-width: 480px) { .result-card { padding: 36px 24px; } .gh-nav { padding: 0 16px; } }
  </style>
</head>
<body>
<div class="gh-topbar">🌸 Miễn phí vận chuyển đơn từ 500.000₫ &nbsp;·&nbsp; Giao hàng toàn quốc</div>
<nav class="gh-nav">
  <a href="index.html" class="gh-nav-link">← Trang Chủ</a>
  <a href="index.html" class="gh-logo">GlowHub</a>
  <div style="text-align:right">
    <a href="profile.html" class="gh-nav-link">Tài Khoản</a>
  </div>
</nav>

<div class="page-wrap">
  <div class="result-card">
    <div class="result-icon"><i class="bi bi-x-circle-fill"></i></div>
    <div class="result-eyebrow" id="resultEyebrow">Thất Bại</div>
    <h1 class="result-title" id="resultTitle">Thanh Toán Thất Bại</h1>
    <p class="result-sub" id="resultSub">Giao dịch không thành công. Đơn hàng của bạn chưa được thanh toán.</p>

    <div class="order-info" id="orderInfo" style="display:none">
      <div class="order-info-row">
        <span class="lbl">Mã đơn hàng</span>
        <span class="val" id="infoCode">—</span>
      </div>
      <div class="order-info-row">
        <span class="lbl">Phương thức</span>
        <span class="val" id="infoMethod">—</span>
      </div>
    </div>

    <div class="reason-box" id="reasonBox" style="display:none">
      <i class="bi bi-info-circle"></i>
      <span id="reasonText"></span>
    </div>

    <div class="actions" id="actionsWrap">
      <a class="btn-primary" id="retryBtn" href="#" onclick="retryPayment(event)">
        <i class="bi bi-arrow-repeat me-1"></i> Thử Lại Thanh Toán
      </a>
      <a class="btn-outline" href="checkout.html">
        <i class="bi bi-bag me-1"></i> Đặt Đơn Mới
      </a>
      <a class="btn-link" href="profile.html">Xem lịch sử đơn hàng</a>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
// @ts-nocheck
var _orderId = null;
var _payMethod = null;

var reasonMap = {
  '07': 'Giao dịch bị nghi ngờ gian lận.',
  '09': 'Thẻ/Tài khoản chưa đăng ký dịch vụ InternetBanking.',
  '10': 'Xác thực thông tin thẻ quá 3 lần.',
  '11': 'Phiên thanh toán đã hết hạn.',
  '12': 'Thẻ/Tài khoản bị khóa.',
  '13': 'OTP không đúng.',
  '24': 'Người dùng hủy giao dịch.',
  '51': 'Số dư không đủ.',
  '65': 'Tài khoản đã vượt hạn mức giao dịch.',
  '75': 'Ngân hàng đang bảo trì.',
  'expired': 'Đơn hàng đã hết hạn thanh toán và bị hủy tự động.',
  'invalid_signature': 'Chữ ký không hợp lệ — giao dịch bị từ chối.'
};

document.addEventListener('DOMContentLoaded', function() {
  var params = new URLSearchParams(location.search);
  _orderId = params.get('orderId');
  _payMethod = params.get('method') || 'VNPAY';
  var status = params.get('status');
  var code = params.get('code') || '';
  var message = params.get('message') || '';

  if (_orderId) {
    document.getElementById('orderInfo').style.display = 'block';
    document.getElementById('infoCode').textContent = 'ORD-' + String(_orderId).padStart(6,'0');
    document.getElementById('infoMethod').textContent = _payMethod;
  }

  var reason = reasonMap[code] || reasonMap[message] || '';
  if (reason) {
    document.getElementById('reasonBox').style.display = 'block';
    document.getElementById('reasonText').textContent = reason;
  }

  if (status === 'expired') {
    document.getElementById('resultTitle').textContent = 'Đơn Hàng Đã Hết Hạn';
    document.getElementById('resultSub').textContent = 'Thời gian thanh toán đã hết. Đơn hàng bị hủy và hàng đã được hoàn lại kho.';
    document.getElementById('retryBtn').style.display = 'none';
  }
});

function retryPayment(e) {
  e.preventDefault();
  if (!_orderId) { window.location.href = 'checkout.html'; return; }
  window.location.href = 'waiting-payment.html?orderId=' + _orderId + '&method=' + _payMethod;
}
</script>
</body>
</html>
