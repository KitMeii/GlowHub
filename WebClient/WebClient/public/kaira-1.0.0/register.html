<!doctype html>
<html lang="vi">
  <head>
    <title>Đăng Ký — GlowHub</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Marcellus&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/glowhub-theme.css" />
  </head>

  <body>
    <div class="gh-auth-shell">
      <div class="gh-auth-card" style="max-width:560px">
        <div class="gh-auth-card__brand"><a href="index.html" style="text-decoration:none;color:inherit">GLOWHUB</a></div>
        <h1 class="gh-auth-card__title">Tạo Tài Khoản</h1>

        <form id="register-form">
          <div class="row g-3">
            <div class="col-12">
              <label class="gh-label">Họ và tên *</label>
              <input type="text" name="Name" class="gh-input" placeholder="Nguyễn Thị Lan" required />
            </div>

            <div class="col-md-6">
              <label class="gh-label">Tên đăng nhập *</label>
              <input type="text" name="UserName" class="gh-input" placeholder="lan.nguyen" required />
            </div>

            <div class="col-md-6">
              <label class="gh-label">Email *</label>
              <input type="email" name="Email" class="gh-input" placeholder="lan@gmail.com" required />
            </div>

            <div class="col-md-6">
              <label class="gh-label">Số điện thoại *</label>
              <input type="text" name="Phone" class="gh-input" placeholder="0912..." required />
            </div>

            <div class="col-md-6">
              <label class="gh-label">Ghi chú/Liên hệ</label>
              <input type="text" name="Contact" class="gh-input" placeholder="Khách hàng thân thiết" />
            </div>

            <div class="col-md-6">
              <label class="gh-label">Mật khẩu *</label>
              <input type="password" name="Password" class="gh-input" placeholder="••••••••" minlength="6" required />
            </div>

            <div class="col-md-6">
              <label class="gh-label">Nhập lại mật khẩu *</label>
              <input type="password" name="ConfirmPassword" class="gh-input" placeholder="••••••••" minlength="6" required />
            </div>
          </div>

          <button type="submit" class="gh-btn gh-btn--dark gh-btn--block gh-btn--lg gh-mt-s5">Hoàn Tất Đăng Ký</button>
        </form>

        <div class="gh-auth-card__foot">
          Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
  </body>
</html>
