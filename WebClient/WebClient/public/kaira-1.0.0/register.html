<!doctype html>
<html lang="en">
  <head>
    <title>Đăng ký thành viên - GlowHub</title>
    <meta charset="utf-8" />
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="css/vendor.css" />
    <link rel="stylesheet" type="text/css" href="style.css" />

    <style>
      body {
        background-color: #fffdf9;
        font-family: "Jost", sans-serif;
      }
      .register-wrapper {
        padding: 60px 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
      }
      .register-card {
        background: #fff;
        border: 1px solid #f1f1f1;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
        width: 100%;
        max-width: 550px;
        margin: 0 auto;
      }
      .section-title {
        font-family: "Marcellus", serif;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #111;
      }
      .form-label {
        font-size: 11px;
        text-transform: uppercase;
        font-weight: 700;
        color: #333;
        margin-top: 10px;
      }
      .form-control {
        border-radius: 0;
        padding: 12px;
        border: 1px solid #e1e1e1;
        font-size: 15px;
      }
      .btn-register {
        background: #111;
        color: #fff;
        border: none;
        padding: 16px;
        width: 100%;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: 25px;
        transition: 0.3s;
      }
      .btn-register:hover {
        background: #f759ab;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,700;1,300&family=Marcellus&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript
      ><link
        href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,700;1,300&family=Marcellus&display=swap"
        rel="stylesheet"
    /></noscript>
  </head>
  <body>
    <div class="register-wrapper">
      <div class="container">
        <div class="register-card">
          <h2 class="section-title text-center mb-4">Tham gia GlowHub</h2>

          <form id="register-form">
            <div class="row">
              <div class="col-md-12 mb-3">
                <label class="form-label">Họ và tên</label>
                <input
                  type="text"
                  name="Name"
                  class="form-control"
                  placeholder="Nguyễn Thị Lan"
                  required
                />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Tên đăng nhập</label>
                <input
                  type="text"
                  name="UserName"
                  class="form-control"
                  placeholder="lan.nguyen"
                  required
                />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input
                  type="email"
                  name="Email"
                  class="form-control"
                  placeholder="lan@gmail.com"
                  required
                />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Số điện thoại</label>
                <input
                  type="text"
                  name="Phone"
                  class="form-control"
                  placeholder="0912..."
                  required
                />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Ghi chú/Liên hệ</label>
                <input
                  type="text"
                  name="Contact"
                  class="form-control"
                  placeholder="Khách hàng thân thiết"
                />
              </div>

              <div class="col-md-12 mb-2">
                <label class="form-label">Mật khẩu</label>
                <input
                  type="password"
                  name="Password"
                  class="form-control"
                  placeholder="••••••••"
                  minlength="6"
                  required
                />
              </div>

              <div class="col-md-12 mb-2">
                <label class="form-label">Nhập lại mật khẩu</label>
                <input
                  type="password"
                  name="ConfirmPassword"
                  class="form-control"
                  placeholder="••••••••"
                  minlength="6"
                  required
                />
              </div>
            </div>

            <button type="submit" class="btn-register">Hoàn tất đăng ký</button>
          </form>

          <div class="text-center mt-4">
            <p class="small text-muted">
              Bạn đã có tài khoản?
              <a href="login.html" style="color: #f759ab" class="fw-bold"
                >Đăng nhập ngay</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>

    <script src="js/jquery.min.js" defer></script>
    <script src="js/api.js" defer></script>
    <script>
      // Register form is handled by api.js (DOMContentLoaded on register.html)
    </script>
  </body>
</html>
