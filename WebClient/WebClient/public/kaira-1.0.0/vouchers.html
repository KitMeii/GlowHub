<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎫 Kho Voucher — GlowHub</title>
    <meta name="description" content="Kho voucher GlowHub — Săn mã giảm giá, ưu đãi hấp dẫn!" />
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400;500;700&family=Marcellus&display=swap"
          rel="stylesheet" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="theme/voucher.css" />
  </head>
  <body style="background:var(--cream-soft); font-family:var(--font-body); min-height:100vh; display:flex; flex-direction:column;">

    <!-- NAVBAR -->
    <nav class="vo-nav">
      <div class="vo-nav-inner">
        <a href="index.html" class="vo-brand">GLOWHUB</a>
        <div class="vo-nav-links">
          <a href="index.html" class="vo-nav-link">Trang Chủ</a>
          <a href="shop.html" class="vo-nav-link">Cửa Hàng</a>
          <a href="flash-sale.html" class="vo-nav-link">Flash Sale</a>
        </div>
        <a href="cart.html" class="vo-nav-link" style="font-size:20px; position:relative;">
          <i class="bi bi-bag"></i>
          <span id="cart-count" style="
            position:absolute; top:-6px; right:-8px;
            background:var(--pink); color:#fff;
            font-size:9px; border-radius:999px;
            padding:1px 5px; font-family:var(--font-body);
          ">0</span>
        </a>
      </div>
    </nav>

    <!-- HERO -->
    <div class="vo-hero">
      <div class="vo-hero-eyebrow">
        <i class="bi bi-ticket-perforated-fill"></i>
        <span>Kho Voucher GlowHub</span>
      </div>
      <h1 class="vo-hero-title">🎫 VOUCHER</h1>
      <p class="vo-hero-sub">Săn ưu đãi · Tiết kiệm thật nhiều</p>
    </div>

    <!-- MAIN -->
    <main style="flex:1; max-width:var(--container); margin:0 auto; padding:40px var(--gutter) 60px; width:100%;">

      <!-- TABS -->
      <div class="vo-tabs" role="tablist">
        <button class="vo-tab-btn active" data-tab="all" onclick="switchTab('all',this)">
          Tất Cả <span class="vo-tab-badge" id="badge-all">0</span>
        </button>
        <button class="vo-tab-btn" data-tab="system" onclick="switchTab('system',this)">
          Hệ Thống <span class="vo-tab-badge" id="badge-system">0</span>
        </button>
        <button class="vo-tab-btn" data-tab="shop" onclick="switchTab('shop',this)">
          Theo Shop <span class="vo-tab-badge" id="badge-shop">0</span>
        </button>
        <button class="vo-tab-btn" data-tab="saved" onclick="switchTab('saved',this)">
          Đã Lưu <span class="vo-tab-badge" id="badge-saved" style="background:var(--success);">0</span>
        </button>
      </div>

      <!-- SEARCH -->
      <div class="vo-search-bar">
        <input type="text" class="vo-search-input" id="vo-search" placeholder="Tìm mã voucher..." oninput="filterVouchers()" />
        <button class="vo-search-btn"><i class="bi bi-search"></i></button>
      </div>

      <!-- LOGIN NOTICE (for saved tab) -->
      <div id="vo-login-notice" style="display:none; padding:24px; background:#fff; border:1px solid var(--border); text-align:center; margin-bottom:24px;">
        <i class="bi bi-person-lock" style="font-size:2rem; color:var(--pink); opacity:0.5; display:block; margin-bottom:12px;"></i>
        <p style="font-size:13px; color:var(--gray); margin-bottom:16px;">Đăng nhập để xem và lưu voucher của bạn</p>
        <a href="login.html?redirect=vouchers.html" style="
          display:inline-block; background:var(--dark); color:#fff;
          padding:10px 28px; text-decoration:none;
          font-size:11px; letter-spacing:2px; text-transform:uppercase;
        ">Đăng Nhập</a>
      </div>

      <!-- SKELETON -->
      <div class="vo-grid" id="vo-skeleton">
        <div class="vo-skel-card"></div>
        <div class="vo-skel-card"></div>
        <div class="vo-skel-card"></div>
        <div class="vo-skel-card"></div>
        <div class="vo-skel-card"></div>
        <div class="vo-skel-card"></div>
      </div>

      <!-- VOUCHER GRID -->
      <div class="vo-grid" id="vo-grid" style="display:none;"></div>

      <!-- EMPTY STATE -->
      <div class="vo-empty" id="vo-empty" style="display:none;">
        <i class="bi bi-ticket-perforated"></i>
        <h3>Không Có Voucher</h3>
        <p style="font-size:13px;">Hiện không có voucher phù hợp.<br>Quay lại sau nhé!</p>
        <a href="shop.html" style="
          display:inline-block; margin-top:20px;
          padding:12px 28px; background:var(--dark);
          color:#fff; text-decoration:none;
          font-size:11px; letter-spacing:2px; text-transform:uppercase;
        ">Xem Cửa Hàng</a>
      </div>

    </main>

    <!-- FOOTER -->
    <footer class="vo-footer">
      <p>&copy; 2025 GlowHub — <a href="policy.html">Chính sách</a> · <a href="shop.html">Cửa hàng</a></p>
    </footer>

    <!-- TOAST -->
    <div class="vo-toast" id="vo-toast"></div>

    <script src="js/api.js"></script>
    <script>
    // ── State ──────────────────────────────────────────
    var _allVouchers    = [];  // from /public
    var _savedVouchers  = [];  // from /my
    var _currentTab     = "all";
    var _savedIds       = new Set();

    const fmt = n => new Intl.NumberFormat("vi-VN").format(n) + "₫";

    function isLoggedIn() {
      try { return !!(Auth && Auth.getToken && Auth.getToken()); } catch(_) { return false; }
    }

    // ── Toast ──────────────────────────────────────────
    function showToast(msg, ok) {
      var t = document.getElementById("vo-toast");
      t.textContent = msg;
      t.style.borderLeftColor = ok === false ? "var(--error)" : ok === "warn" ? "var(--warning)" : "var(--pink)";
      t.classList.add("show");
      clearTimeout(t._tid);
      t._tid = setTimeout(() => t.classList.remove("show"), 3000);
    }

    // ── Render card ────────────────────────────────────
    function discountLabel(v) {
      if (v.discountType === "percent") return `-${v.discountValue}%`;
      return `-${fmt(v.discountValue)}`;
    }

    function renderCard(v, isSaved) {
      var typeBadge = v.voucherType === "shop"
        ? '<span class="vo-card-type-badge"><i class="bi bi-shop"></i> Shop Voucher</span>'
        : '<span class="vo-card-type-badge"><i class="bi bi-stars"></i> Hệ Thống</span>';

      var stripeClass = v.voucherType === "shop" ? "shop" : "system";

      var expiry = v.expiryDate
        ? new Date(v.expiryDate).toLocaleDateString("vi-VN")
        : "Không giới hạn";

      var minOrder = v.minOrderAmount > 0
        ? `<span class="vo-card-meta-chip">Đơn tối thiểu ${fmt(v.minOrderAmount)}</span>` : "";

      var maxDisc = v.maxDiscount
        ? `<span class="vo-card-meta-chip">Giảm tối đa ${fmt(v.maxDiscount)}</span>` : "";

      var remain = v.remainingUsage != null
        ? `<span class="vo-card-meta-chip warn">Còn ${v.remainingUsage} lượt</span>` : "";

      var alreadySaved = _savedIds.has(v.id);
      var saveBtn = "";
      if (isLoggedIn()) {
        saveBtn = alreadySaved
          ? `<button class="vo-btn-save saved" disabled>✓ Đã Lưu</button>`
          : `<button class="vo-btn-save" onclick="saveVoucher(this,'${v.code}',${v.id})">Lưu</button>`;
      }

      return `
      <div class="vo-card" id="vc-${v.id}">
        <div class="vo-card-stripe ${stripeClass}"></div>
        <div class="vo-card-body">
          ${typeBadge}
          <div class="vo-card-title">${discountLabel(v)} — ${v.description || v.code}</div>
          <div class="vo-card-desc">
            ${v.maxDiscount ? `Giảm đến ${fmt(v.maxDiscount)} · ` : ""}Hết hạn: ${expiry}
          </div>
          <div class="vo-card-meta">
            ${minOrder}${maxDisc}${remain}
          </div>
          <div class="vo-card-code-row">
            <span class="vo-card-code">${v.code}</span>
            <button class="vo-btn-copy" onclick="copyCode(this,'${v.code}')">
              <i class="bi bi-clipboard"></i> Sao Chép
            </button>
            ${saveBtn}
          </div>
        </div>
      </div>`;
    }

    function renderSavedCard(cv) {
      var v = cv.voucher || cv;
      var expiry = v.expiryDate
        ? new Date(v.expiryDate).toLocaleDateString("vi-VN")
        : "Không giới hạn";
      var expired = v.isExpired || (v.expiryDate && new Date(v.expiryDate) < new Date());

      return `
      <div class="vo-card" style="${expired ? 'opacity:0.55;' : ''}">
        <div class="vo-card-stripe system"></div>
        <div class="vo-card-body">
          <span class="vo-card-type-badge">${expired ? '<span style="color:var(--error)">Đã Hết Hạn</span>' : '<i class="bi bi-bookmark-fill" style="color:var(--success)"></i> Đã Lưu'}</span>
          <div class="vo-card-title">${discountLabel(v)} — ${v.description || v.code}</div>
          <div class="vo-card-desc">Hết hạn: ${expiry}</div>
          <div class="vo-card-code-row">
            <span class="vo-card-code">${v.code}</span>
            ${!expired ? `<button class="vo-btn-copy" onclick="copyCode(this,'${v.code}')"><i class="bi bi-clipboard"></i> Sao Chép</button>` : ""}
          </div>
        </div>
      </div>`;
    }

    // ── Switch tab ─────────────────────────────────────
    function switchTab(tab, btn) {
      _currentTab = tab;
      document.querySelectorAll(".vo-tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      if (tab === "saved" && !isLoggedIn()) {
        document.getElementById("vo-grid").style.display = "none";
        document.getElementById("vo-empty").style.display = "none";
        document.getElementById("vo-login-notice").style.display = "";
        return;
      }
      document.getElementById("vo-login-notice").style.display = "none";
      filterVouchers();
    }

    // ── Filter / render current tab ────────────────────
    function filterVouchers() {
      var q = (document.getElementById("vo-search").value || "").toLowerCase().trim();
      var grid   = document.getElementById("vo-grid");
      var empty  = document.getElementById("vo-empty");

      var items;
      if (_currentTab === "saved") {
        items = _savedVouchers;
        if (q) items = items.filter(cv => {
          var v = cv.voucher || cv;
          return v.code.toLowerCase().includes(q) || (v.description || "").toLowerCase().includes(q);
        });
        if (items.length === 0) { grid.style.display = "none"; empty.style.display = ""; return; }
        grid.innerHTML = items.map(renderSavedCard).join("");
      } else {
        items = _allVouchers;
        if (_currentTab === "system") items = items.filter(v => v.voucherType === "system");
        if (_currentTab === "shop")   items = items.filter(v => v.voucherType === "shop");
        if (q) items = items.filter(v =>
          v.code.toLowerCase().includes(q) || (v.description || "").toLowerCase().includes(q));
        if (items.length === 0) { grid.style.display = "none"; empty.style.display = ""; return; }
        grid.innerHTML = items.map(v => renderCard(v, _savedIds.has(v.id))).join("");
      }

      empty.style.display = "none";
      grid.style.display = "";
    }

    // ── Copy code ──────────────────────────────────────
    function copyCode(btn, code) {
      navigator.clipboard.writeText(code).then(() => {
        btn.classList.add("copied");
        btn.innerHTML = '<i class="bi bi-check-lg"></i> Đã Chép';
        showToast("Đã sao chép mã: " + code);
        setTimeout(() => {
          btn.classList.remove("copied");
          btn.innerHTML = '<i class="bi bi-clipboard"></i> Sao Chép';
        }, 2000);
      }).catch(() => {
        showToast("Không thể sao chép. Mã: " + code, "warn");
      });
    }

    // ── Save voucher ───────────────────────────────────
    async function saveVoucher(btn, code, id) {
      btn.disabled = true;
      btn.textContent = "Đang lưu...";
      try {
        const res = await fetch("/api/vouchers/save/" + code, {
          method: "POST",
          headers: { "Authorization": "Bearer " + Auth.getToken() }
        });
        if (!res.ok) {
          var data = await res.json().catch(() => ({}));
          showToast(data.message || "Không thể lưu voucher", false);
          btn.disabled = false;
          btn.textContent = "Lưu";
          return;
        }
        _savedIds.add(id);
        btn.classList.add("saved");
        btn.textContent = "✓ Đã Lưu";
        showToast("Đã lưu voucher " + code + " vào tài khoản!");
        document.getElementById("badge-saved").textContent =
          parseInt(document.getElementById("badge-saved").textContent || "0") + 1;
      } catch (e) {
        showToast("Lỗi kết nối", false);
        btn.disabled = false;
        btn.textContent = "Lưu";
      }
    }

    // ── Update badge counts ────────────────────────────
    function updateBadges() {
      var all    = _allVouchers.length;
      var system = _allVouchers.filter(v => v.voucherType === "system").length;
      var shop   = _allVouchers.filter(v => v.voucherType === "shop").length;
      var saved  = _savedVouchers.length;
      document.getElementById("badge-all").textContent    = all;
      document.getElementById("badge-system").textContent = system;
      document.getElementById("badge-shop").textContent   = shop;
      document.getElementById("badge-saved").textContent  = saved;
    }

    // ── Cart count ─────────────────────────────────────
    function updateCartCount() {
      try {
        var cnt = (CartDB ? CartDB.getAll() : []).reduce((s, i) => s + (i.quantity || 1), 0);
        document.getElementById("cart-count").textContent = cnt;
      } catch(_) {}
    }

    // ── Init ───────────────────────────────────────────
    document.addEventListener("DOMContentLoaded", async () => {
      updateCartCount();

      // Load public vouchers
      try {
        const res = await fetch("/api/vouchers/public");
        if (res.ok) {
          _allVouchers = await res.json();
        }
      } catch(_) {}

      // Load saved vouchers if logged in
      if (isLoggedIn()) {
        try {
          const res = await fetch("/api/vouchers/my", {
            headers: { "Authorization": "Bearer " + Auth.getToken() }
          });
          if (res.ok) {
            _savedVouchers = await res.json();
            _savedVouchers.forEach(cv => {
              if (cv.voucher) _savedIds.add(cv.voucher.id);
            });
          }
        } catch(_) {}
      }

      document.getElementById("vo-skeleton").style.display = "none";
      updateBadges();
      filterVouchers();
    });
    </script>
  </body>
</html>
