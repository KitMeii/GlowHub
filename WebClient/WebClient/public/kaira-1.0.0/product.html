<!doctype html>
<html lang="vi">
  <head>
    <title>Chi Tiết Sản Phẩm — GlowHub</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Marcellus&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/glowhub-theme.css" />

    <style>
      .gh-pd {
        padding: var(--gh-s7) 0;
      }
      .gh-pd__media {
        position: sticky;
        top: 96px;
      }
      .gh-pd__main-img {
        background: var(--gh-surface);
        border-radius: var(--gh-radius);
        overflow: hidden;
        margin-bottom: var(--gh-s3);
        aspect-ratio: 4 / 5;
      }
      .gh-pd__main-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .gh-pd__thumbs {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
        gap: var(--gh-s2);
      }
      .gh-pd__thumb {
        aspect-ratio: 1 / 1;
        border: 2px solid transparent;
        border-radius: var(--gh-radius-sm);
        overflow: hidden;
        cursor: pointer;
        background: var(--gh-surface);
        transition: border-color .2s;
      }
      .gh-pd__thumb img {
        width: 100%; height: 100%; object-fit: cover;
      }
      .gh-pd__thumb.active { border-color: var(--gh-primary); }

      .gh-pd__cat {
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 12px;
        color: var(--gh-text-muted);
      }
      .gh-pd__name {
        font-family: var(--gh-font-display);
        font-size: clamp(1.6rem, 3vw, 2.2rem);
        margin: var(--gh-s2) 0 var(--gh-s3);
      }
      .gh-pd__rating {
        color: var(--gh-warning);
        margin-bottom: var(--gh-s3);
        font-size: 14px;
      }
      .gh-pd__rating a {
        color: var(--gh-text-muted);
        font-size: 13px;
        margin-left: 8px;
        text-decoration: underline;
      }
      .gh-pd__price {
        color: var(--gh-primary);
        font-size: 1.8rem;
        font-weight: 600;
        margin-bottom: var(--gh-s4);
      }
      .gh-pd__desc {
        color: var(--gh-text-muted);
        line-height: 1.7;
        margin-bottom: var(--gh-s5);
      }
      .gh-pd__meta {
        display: grid;
        grid-template-columns: 100px 1fr;
        gap: 8px 16px;
        font-size: 13px;
        margin-bottom: var(--gh-s5);
      }
      .gh-pd__meta .label { color: var(--gh-text-muted); text-transform: uppercase; letter-spacing: 1px; font-size: 11px; align-self: center; }
      .gh-pd__actions {
        display: flex;
        gap: var(--gh-s3);
        align-items: stretch;
        flex-wrap: wrap;
        margin-bottom: var(--gh-s5);
      }
      .gh-pd__stock-badge {
        display: inline-block;
        padding: 4px 10px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 999px;
        background: var(--gh-surface);
        margin-bottom: var(--gh-s3);
      }
      .gh-pd__stock-badge.ok { background: #d1fae5; color: #065f46; }
      .gh-pd__stock-badge.low { background: #fef3c7; color: #92400e; }
      .gh-pd__stock-badge.out { background: #fee2e2; color: #991b1b; }

      .gh-review-item {
        padding: var(--gh-s4) 0;
        border-bottom: 1px solid var(--gh-border);
      }
      .gh-review-item:last-child { border-bottom: none; }
      .gh-review-item__head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
      }
      .gh-review-item__author { font-weight: 600; font-size: 14px; }
      .gh-review-item__date { font-size: 12px; color: var(--gh-text-muted); }
      .gh-review-item__rating { color: var(--gh-warning); font-size: 13px; margin-bottom: 6px; }
      .gh-review-item__text { font-size: 14px; line-height: 1.6; color: #333; }

      .gh-rating-input {
        display: flex;
        gap: 4px;
        font-size: 28px;
        color: #ddd;
        margin-bottom: var(--gh-s3);
      }
      .gh-rating-input span { cursor: pointer; transition: color .15s; }
      .gh-rating-input span:hover,
      .gh-rating-input span.on { color: var(--gh-warning); }
    </style>
  </head>

  <body>
    <div id="gh-layout-header"></div>

    <main class="gh-pd">
      <div class="container">
        <div class="gh-breadcrumb mb-4">
          <a href="index.html">Trang Chủ</a><span class="sep">/</span>
          <a href="shop.html">Cửa Hàng</a><span class="sep">/</span>
          <span id="bc-name">Sản phẩm</span>
        </div>

        <div class="row g-5" id="pd-body">
          <div class="col-12 text-center py-5 text-muted">Đang tải sản phẩm...</div>
        </div>

        <hr class="gh-divider gh-mt-s6" />

        <!-- Tabs -->
        <section class="gh-mt-s6">
          <ul class="gh-tabs" role="tablist">
            <li><button class="gh-tabs__btn active" data-tab="desc">Mô Tả</button></li>
            <li><button class="gh-tabs__btn" data-tab="info">Thông Tin</button></li>
            <li><button class="gh-tabs__btn" data-tab="reviews">Đánh Giá <span id="review-count-badge"></span></button></li>
          </ul>

          <div id="tab-desc" class="gh-tab-panel">
            <p id="tab-desc-content" class="gh-text-muted" style="line-height:1.8">Đang tải mô tả...</p>
          </div>

          <div id="tab-info" class="gh-tab-panel" style="display:none">
            <div id="tab-info-content"></div>
          </div>

          <div id="tab-reviews" class="gh-tab-panel" style="display:none">
            <div id="reviews-list" class="mb-5"></div>
            <div id="review-form-host"></div>
          </div>
        </section>

        <!-- Related -->
        <section class="gh-mt-s6">
          <h3 class="gh-section-title" style="font-size:1.4rem">Sản Phẩm Liên Quan</h3>
          <div class="row g-4 gh-mt-s5" id="related-grid"></div>
        </section>
      </div>
    </main>

    <div id="gh-layout-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>

    <script>
      const FALLBACK_IMG = 'https://images.unsplash.com/photo-1556228720-195a672e8a03?w=600&q=80';

      function _extractList(res) {
        if (!res) return [];
        if (Array.isArray(res)) return res;
        if (Array.isArray(res.items)) return res.items;
        if (Array.isArray(res.data)) return res.data;
        return [];
      }

      function getProductId() {
        return new URLSearchParams(window.location.search).get('id');
      }

      function renderGallery(images) {
        const main = images[0] || FALLBACK_IMG;
        return `
          <div class="gh-pd__media">
            <div class="gh-pd__main-img">
              <img id="pd-main-img" src="${main}" alt="" onerror="this.src='${FALLBACK_IMG}'"/>
            </div>
            <div class="gh-pd__thumbs" id="pd-thumbs">
              ${images.map((img, i) => `
                <div class="gh-pd__thumb ${i === 0 ? 'active' : ''}" data-img="${img}">
                  <img src="${img}" alt="thumb-${i}" onerror="this.src='${FALLBACK_IMG}'"/>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      function stockBadge(stock) {
        if (stock == null) return '';
        if (stock <= 0)   return `<span class="gh-pd__stock-badge out">Hết hàng</span>`;
        if (stock < 5)    return `<span class="gh-pd__stock-badge low">Sắp hết (${stock})</span>`;
        return `<span class="gh-pd__stock-badge ok">Còn hàng (${stock})</span>`;
      }

      async function renderProduct() {
        const id = getProductId();
        if (!id) {
          document.getElementById('pd-body').innerHTML = `<div class="col-12"><div class="gh-empty-state">Không tìm thấy mã sản phẩm.</div></div>`;
          return;
        }

        let p;
        try {
          p = await Product.getById(id);
        } catch (err) {
          document.getElementById('pd-body').innerHTML = `<div class="col-12"><div class="gh-empty-state"><div class="gh-empty-state__title">Lỗi tải sản phẩm</div>${err.message || ''}</div></div>`;
          return;
        }

        const name  = p.Name || p.name || 'Sản phẩm';
        const price = p.Price || p.price || 0;
        const desc  = p.Description || p.description || '';
        const cat   = p.CategoryName || p.categoryName || '';
        const stock = p.Stock ?? p.stock;
        const images = getProductImageList(p);
        if (images.length === 0) images.push(FALLBACK_IMG);

        document.getElementById('bc-name').textContent = name;
        document.title = `${name} — GlowHub`;

        document.getElementById('pd-body').innerHTML = `
          <div class="col-lg-6">
            ${renderGallery(images)}
          </div>
          <div class="col-lg-6">
            ${stockBadge(stock)}
            <div class="gh-pd__cat">${cat}</div>
            <h1 class="gh-pd__name">${name}</h1>
            <div class="gh-pd__rating" id="pd-rating">★★★★★ <a href="#tab-reviews" id="pd-reviews-link">(đang tải...)</a></div>
            <div class="gh-pd__price">${_fmtMoney(price)}</div>
            <p class="gh-pd__desc">${(desc || 'Sản phẩm chính hãng GlowHub — chất lượng được kiểm định.').substring(0, 280)}${desc && desc.length > 280 ? '...' : ''}</p>

            <div class="gh-pd__actions">
              <div class="gh-qty">
                <button id="qty-minus">−</button>
                <input id="qty-input" type="number" value="1" min="1" max="${stock || 999}" />
                <button id="qty-plus">+</button>
              </div>
              <button class="gh-btn gh-btn--dark" id="add-cart-btn" ${stock <= 0 ? 'disabled' : ''}>Thêm Vào Giỏ</button>
              <button class="gh-btn gh-btn--primary" id="buy-now-btn" ${stock <= 0 ? 'disabled' : ''}>Mua Ngay</button>
            </div>

            <div class="gh-pd__meta">
              <span class="label">Mã SP</span><span>#${p.Id || p.id}</span>
              <span class="label">Danh mục</span><span>${cat || '—'}</span>
              <span class="label">Tình trạng</span><span>${stock > 0 ? 'Còn hàng' : 'Hết hàng'}</span>
            </div>

            <p class="gh-text-muted" style="font-size:13px">
              🚚 Miễn phí vận chuyển cho đơn từ 500.000₫ &nbsp;•&nbsp; 🔄 Đổi trả trong 7 ngày
            </p>
          </div>
        `;

        // Description tab
        document.getElementById('tab-desc-content').textContent = desc || 'Sản phẩm chính hãng GlowHub — chất lượng được kiểm định.';

        // Info tab
        document.getElementById('tab-info-content').innerHTML = `
          <div class="row g-3">
            <div class="col-md-6">
              <div class="gh-card">
                <h4 class="gh-card__title">Thông số</h4>
                <table class="table table-borderless" style="font-size:14px">
                  <tr><td class="gh-text-muted">Mã SP</td><td><b>#${p.Id || p.id}</b></td></tr>
                  <tr><td class="gh-text-muted">Tên</td><td>${name}</td></tr>
                  <tr><td class="gh-text-muted">Danh mục</td><td>${cat || '—'}</td></tr>
                  <tr><td class="gh-text-muted">Giá</td><td class="gh-text-primary"><b>${_fmtMoney(price)}</b></td></tr>
                  <tr><td class="gh-text-muted">Tồn kho</td><td>${stock ?? '—'}</td></tr>
                </table>
              </div>
            </div>
            <div class="col-md-6">
              <div class="gh-card">
                <h4 class="gh-card__title">Chính sách</h4>
                <ul style="font-size:14px;line-height:1.9;padding-left:18px">
                  <li>Miễn phí vận chuyển cho đơn từ 500.000₫</li>
                  <li>Đổi trả miễn phí trong 7 ngày</li>
                  <li>Hàng chính hãng — cam kết 100%</li>
                  <li>Hỗ trợ tư vấn 24/7</li>
                </ul>
              </div>
            </div>
          </div>
        `;

        // Wire up gallery + qty + cart
        document.querySelectorAll('.gh-pd__thumb').forEach(t => {
          t.addEventListener('click', () => {
            document.querySelectorAll('.gh-pd__thumb').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            document.getElementById('pd-main-img').src = t.dataset.img;
          });
        });

        const qty = document.getElementById('qty-input');
        document.getElementById('qty-minus').addEventListener('click', () => {
          qty.value = Math.max(1, (parseInt(qty.value) || 1) - 1);
        });
        document.getElementById('qty-plus').addEventListener('click', () => {
          const max = parseInt(qty.max) || 999;
          qty.value = Math.min(max, (parseInt(qty.value) || 1) + 1);
        });

        document.getElementById('add-cart-btn').addEventListener('click', async () => {
          const n = Math.max(1, parseInt(qty.value) || 1);
          await Cart.add({ ...p, image: images[0] }, n);
          showGlobalToast(`Đã thêm "${name}" vào giỏ`);
        });
        document.getElementById('buy-now-btn').addEventListener('click', async () => {
          const n = Math.max(1, parseInt(qty.value) || 1);
          await Cart.add({ ...p, image: images[0] }, n);
          window.location.href = 'checkout.html';
        });

        // Load reviews + related (parallel)
        renderReviews(id);
        renderRelated(p.CategoryId || p.categoryId, id);
      }

      async function renderReviews(productId) {
        const list = document.getElementById('reviews-list');
        const badge = document.getElementById('review-count-badge');
        const link = document.getElementById('pd-reviews-link');

        let reviews = [];
        try { reviews = await Review.getByProduct(productId); } catch (_) {}
        reviews = _extractList(reviews);

        // Average rating
        let avg = 0;
        if (reviews.length) {
          const sum = reviews.reduce((s, r) => s + (r.Rating || r.rating || 0), 0);
          avg = (sum / reviews.length).toFixed(1);
        }
        if (link) link.textContent = `(${reviews.length} đánh giá${avg ? ` — ${avg}/5` : ''})`;
        if (badge) badge.textContent = `(${reviews.length})`;

        if (!reviews.length) {
          list.innerHTML = `<div class="gh-empty-state"><div class="gh-empty-state__icon">★</div>Chưa có đánh giá nào — hãy là người đầu tiên!</div>`;
        } else {
          list.innerHTML = reviews.map(r => {
            const rating = r.Rating || r.rating || 0;
            const author = r.UserName || r.userName || 'Khách';
            const date = r.CreatedAt || r.createdAt;
            const dateStr = date ? new Date(date).toLocaleDateString('vi-VN') : '';
            const comment = (r.Comment || r.comment || '').replace(/</g, '&lt;');
            return `
              <div class="gh-review-item">
                <div class="gh-review-item__head">
                  <div class="gh-review-item__author">${author}</div>
                  <div class="gh-review-item__date">${dateStr}</div>
                </div>
                <div class="gh-review-item__rating">${'★'.repeat(rating)}${'☆'.repeat(5 - rating)}</div>
                <div class="gh-review-item__text">${comment}</div>
              </div>
            `;
          }).join('');
        }

        // Review form
        const formHost = document.getElementById('review-form-host');
        if (!Auth.isLoggedIn()) {
          formHost.innerHTML = `
            <div class="gh-card">
              <p class="text-center gh-text-muted m-0">
                <a href="login.html?redirect=${encodeURIComponent(window.location.pathname + window.location.search)}" class="gh-text-primary fw-bold">Đăng nhập</a>
                để viết đánh giá. Bạn cần mua và nhận sản phẩm trước.
              </p>
            </div>
          `;
        } else {
          formHost.innerHTML = `
            <div class="gh-card">
              <h4 class="gh-card__title">Viết Đánh Giá</h4>
              <p class="gh-text-muted mb-3" style="font-size:13px">Bạn cần đã mua và nhận sản phẩm (đơn ở trạng thái <b>Hoàn thành</b>) để gửi đánh giá.</p>
              <div class="gh-rating-input" id="rating-input">
                ${[1,2,3,4,5].map(n => `<span data-val="${n}">★</span>`).join('')}
              </div>
              <label class="gh-label">Nhận xét</label>
              <textarea id="review-comment" class="gh-textarea" placeholder="Chia sẻ trải nghiệm của bạn..."></textarea>
              <button class="gh-btn gh-btn--primary gh-mt-s3" id="submit-review-btn">Gửi Đánh Giá</button>
            </div>
          `;

          let chosen = 5;
          const stars = formHost.querySelectorAll('#rating-input span');
          const paint = (n) => stars.forEach((s, i) => s.classList.toggle('on', i < n));
          paint(chosen);
          stars.forEach((s, i) => {
            s.addEventListener('mouseenter', () => paint(i + 1));
            s.addEventListener('mouseleave', () => paint(chosen));
            s.addEventListener('click', () => { chosen = i + 1; paint(chosen); });
          });

          document.getElementById('submit-review-btn').addEventListener('click', async () => {
            const comment = document.getElementById('review-comment').value.trim();
            if (!comment) { showGlobalToast('Vui lòng nhập nội dung đánh giá', 'error'); return; }
            try {
              await Review.submit(productId, { Rating: chosen, Comment: comment });
              showGlobalToast('Cảm ơn bạn đã đánh giá!');
              renderReviews(productId);
            } catch (err) {
              showGlobalToast(err.message || 'Không gửi được đánh giá', 'error');
            }
          });
        }
      }

      async function renderRelated(categoryId, excludeId) {
        const host = document.getElementById('related-grid');
        if (!categoryId) { host.innerHTML = ''; return; }
        let items = [];
        try {
          const res = await Product.getAll({ categoryId, pageSize: 8 });
          items = _extractList(res);
        } catch (_) {}
        items = items.filter(p => String(p.Id || p.id) !== String(excludeId)).slice(0, 4);
        if (!items.length) { host.innerHTML = `<div class="col-12"><div class="gh-empty-state">Không có sản phẩm liên quan.</div></div>`; return; }
        host.innerHTML = items.map(p => {
          const id = p.Id || p.id;
          const name = (p.Name || p.name || 'Sản phẩm').replace(/'/g, "\\'");
          const price = p.Price || p.price || 0;
          const img = pickFirstImage(p.ImageUrl || p.imageUrl) || FALLBACK_IMG;
          return `
            <div class="col-6 col-md-3">
              <div class="gh-product-card" data-product-id="${id}">
                <a href="product.html?id=${id}" class="gh-product-card__media">
                  <img src="${img}" alt="${name}" onerror="this.src='${FALLBACK_IMG}'"/>
                </a>
                <div class="gh-product-card__body">
                  <a href="product.html?id=${id}" class="gh-product-card__title">${name}</a>
                  <span class="gh-product-card__price">${_fmtMoney(price)}</span>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      // Tab switch
      document.addEventListener('click', e => {
        if (!e.target.matches('.gh-tabs__btn')) return;
        const target = e.target.dataset.tab;
        document.querySelectorAll('.gh-tabs__btn').forEach(b => b.classList.toggle('active', b === e.target));
        ['desc', 'info', 'reviews'].forEach(t => {
          document.getElementById(`tab-${t}`).style.display = (t === target ? 'block' : 'none');
        });
      });

      document.addEventListener('DOMContentLoaded', () => {
        mountLayout({ active: 'shop' });
        renderProduct();
      });
    </script>
  </body>
</html>
