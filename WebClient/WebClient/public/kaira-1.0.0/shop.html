<!doctype html>
<html lang="vi">
  <head>
    <title>Cửa Hàng — GlowHub</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Marcellus&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/glowhub-theme.css" />

    <style>
      .gh-shop__toolbar {
        background: #fff;
        border: 1px solid var(--gh-border);
        border-radius: var(--gh-radius);
        padding: var(--gh-s4);
        margin-bottom: var(--gh-s5);
        display: flex;
        align-items: center;
        gap: var(--gh-s4);
        flex-wrap: wrap;
      }
      .gh-shop__search {
        flex: 1 1 280px;
        min-width: 220px;
        position: relative;
      }
      .gh-shop__search input { padding-left: 38px; }
      .gh-shop__search svg {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--gh-text-muted);
      }
      .gh-shop__view-toggle button {
        width: 38px;
        height: 38px;
        border: 1px solid var(--gh-border);
        background: #fff;
        cursor: pointer;
        border-radius: var(--gh-radius-sm);
      }
      .gh-shop__view-toggle button.active {
        background: var(--gh-text);
        color: #fff;
        border-color: var(--gh-text);
      }
      .gh-shop__sidebar h3 {
        font-family: var(--gh-font-display);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: var(--gh-s3);
      }
      .gh-shop__sidebar .gh-card { margin-bottom: var(--gh-s4); }
      .gh-cat-list label {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 0;
        font-size: 14px;
        cursor: pointer;
        color: var(--gh-text);
      }
      .gh-cat-list label:hover { color: var(--gh-primary); }
      .gh-cat-list input[type="radio"] { accent-color: var(--gh-primary); }

      .gh-shop__grid.list-view > [class*="col-"] {
        flex: 0 0 100%;
        max-width: 100%;
      }
      .gh-shop__grid.list-view .gh-product-card {
        flex-direction: row;
      }
      .gh-shop__grid.list-view .gh-product-card__media {
        flex: 0 0 220px;
      }
      .gh-shop__grid.list-view .gh-product-card__media img {
        aspect-ratio: 1 / 1;
      }
      .gh-shop__grid.list-view .gh-product-card__body {
        flex: 1;
        justify-content: center;
      }
      .gh-shop__grid.list-view .gh-product-card__cta {
        position: static;
        margin: var(--gh-s3) var(--gh-s4) var(--gh-s4);
        width: auto;
        align-self: flex-start;
        padding: 10px 24px;
      }
      @media (max-width: 600px) {
        .gh-shop__grid.list-view .gh-product-card { flex-direction: column; }
        .gh-shop__grid.list-view .gh-product-card__media { flex: 0 0 auto; }
      }
    </style>
  </head>

  <body>
    <div id="gh-layout-header"></div>

    <header class="gh-page-header">
      <div class="container">
        <div class="gh-breadcrumb"><a href="index.html">Trang Chủ</a><span class="sep">/</span><span>Cửa Hàng</span></div>
        <h1>Cửa Hàng</h1>
        <p class="gh-text-muted" id="shop-subtitle">Khám phá toàn bộ bộ sưu tập</p>
      </div>
    </header>

    <main class="gh-section">
      <div class="container">
        <div class="row g-4">
          <aside class="col-lg-3 gh-shop__sidebar">
            <div class="gh-card">
              <h3>Danh Mục</h3>
              <div id="cat-list" class="gh-cat-list">
                <label><input type="radio" name="cat" value="" checked /> Tất cả</label>
              </div>
            </div>

            <div class="gh-card">
              <h3>Khoảng Giá</h3>
              <div class="d-flex gap-2 align-items-center mb-2">
                <input type="number" id="price-min" placeholder="Từ" class="gh-input" min="0" />
                <span>—</span>
                <input type="number" id="price-max" placeholder="Đến" class="gh-input" min="0" />
              </div>
              <button class="gh-btn gh-btn--outline gh-btn--sm gh-btn--block" id="apply-price-btn">Áp Dụng</button>
            </div>

            <button class="gh-btn gh-btn--ghost gh-btn--block" id="reset-filters">↺ Đặt Lại Bộ Lọc</button>
          </aside>

          <div class="col-lg-9">
            <div class="gh-shop__toolbar">
              <div class="gh-shop__search">
                <svg width="16" height="16"><use xlink:href="#gh-i-search"></use></svg>
                <input type="text" id="search-input" class="gh-input" placeholder="Tìm sản phẩm..." />
              </div>

              <select id="sort-select" class="gh-select" style="flex:0 0 200px">
                <option value="newest">Mới nhất</option>
                <option value="price_asc">Giá: Thấp đến Cao</option>
                <option value="price_desc">Giá: Cao đến Thấp</option>
                <option value="name_asc">Tên A–Z</option>
              </select>

              <div class="gh-shop__view-toggle d-flex gap-2">
                <button class="active" data-view="grid" title="Lưới">▦</button>
                <button data-view="list" title="Danh sách">☰</button>
              </div>
            </div>

            <div id="shop-count" class="gh-text-muted mb-3" style="font-size:13px"></div>

            <div class="row g-4 gh-shop__grid" id="shop-grid"></div>

            <div class="gh-pagination gh-mt-s6" id="shop-pagination"></div>
          </div>
        </div>
      </div>
    </main>

    <div id="gh-layout-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>

    <script>
      const PAGE_SIZE = 12;
      const state = {
        keyword: '',
        categoryId: '',
        page: 1,
        sort: 'newest',
        priceMin: null,
        priceMax: null,
      };

      function _extractList(res) {
        if (!res) return [];
        if (Array.isArray(res)) return res;
        if (Array.isArray(res.items)) return res.items;
        if (Array.isArray(res.data)) return res.data;
        return [];
      }

      function _renderProductCard(p) {
        const id    = p.Id || p.id;
        const name  = (p.Name || p.name || 'Sản phẩm').replace(/'/g, "\\'");
        const price = p.Price || p.price || 0;
        const img   = pickFirstImage(p.ImageUrl || p.imageUrl || p.Image || p.image) ||
                      'https://images.unsplash.com/photo-1556228720-195a672e8a03?w=400&q=80';
        const cat   = p.CategoryName || p.categoryName || '';
        const isNew = p.IsNew || p.isNew;

        return `
          <div class="col-6 col-md-4 col-lg-4">
            <div class="gh-product-card" data-product-id="${id}">
              ${isNew ? '<span class="gh-badge gh-badge--new">Mới</span>' : ''}
              <a href="product.html?id=${id}" class="gh-product-card__media">
                <img src="${img}" alt="${name}" loading="lazy"
                     onerror="this.src='https://images.unsplash.com/photo-1556228720-195a672e8a03?w=400&q=80'"/>
              </a>
              <div class="gh-product-card__body">
                ${cat ? `<span class="gh-product-card__cat">${cat}</span>` : ''}
                <a href="product.html?id=${id}" class="gh-product-card__title">${name}</a>
                <div class="gh-product-card__stars">★★★★★</div>
                <span class="gh-product-card__price">${_fmtMoney(price)}</span>
              </div>
              <button class="gh-product-card__cta"
                onclick='Cart.add(${JSON.stringify(p).replace(/'/g, "&apos;")}).then(()=>showGlobalToast("Đã thêm vào giỏ"))'>
                Thêm Vào Giỏ
              </button>
            </div>
          </div>
        `;
      }

      function _sortClient(list) {
        const copy = [...list];
        switch (state.sort) {
          case 'price_asc':  copy.sort((a, b) => (a.Price || a.price || 0) - (b.Price || b.price || 0)); break;
          case 'price_desc': copy.sort((a, b) => (b.Price || b.price || 0) - (a.Price || a.price || 0)); break;
          case 'name_asc':   copy.sort((a, b) => String(a.Name || a.name || '').localeCompare(String(b.Name || b.name || ''))); break;
          default:           copy.sort((a, b) => (b.Id || b.id || 0) - (a.Id || a.id || 0));
        }
        return copy;
      }

      function _filterPriceClient(list) {
        return list.filter(p => {
          const price = p.Price || p.price || 0;
          if (state.priceMin != null && price < state.priceMin) return false;
          if (state.priceMax != null && price > state.priceMax) return false;
          return true;
        });
      }

      async function loadProducts() {
        const grid = document.getElementById('shop-grid');
        const countEl = document.getElementById('shop-count');
        grid.innerHTML = '<div class="col-12 text-center text-muted py-5">Đang tải...</div>';

        const params = { page: state.page, pageSize: PAGE_SIZE };
        if (state.keyword)    params.keyword = state.keyword;
        if (state.categoryId) params.categoryId = state.categoryId;

        let res = null;
        try {
          res = await Product.getAll(params);
        } catch (err) {
          grid.innerHTML = `<div class="col-12"><div class="gh-empty-state"><div class="gh-empty-state__title">Lỗi tải sản phẩm</div>${err.message || ''}</div></div>`;
          countEl.textContent = '';
          return;
        }

        const items = _extractList(res);
        const total = res.totalCount ?? res.total ?? items.length;
        const totalPages = res.totalPages ?? Math.max(1, Math.ceil(total / PAGE_SIZE));

        let display = _filterPriceClient(items);
        display = _sortClient(display);

        if (!display.length) {
          grid.innerHTML = `<div class="col-12"><div class="gh-empty-state"><div class="gh-empty-state__icon">∅</div><div class="gh-empty-state__title">Không có sản phẩm phù hợp</div>Hãy thử bỏ bộ lọc hoặc tìm từ khóa khác.</div></div>`;
        } else {
          grid.innerHTML = display.map(_renderProductCard).join('');
        }
        countEl.textContent = `Hiển thị ${display.length} / ${total} sản phẩm`;

        renderPagination(totalPages);
      }

      function renderPagination(totalPages) {
        const host = document.getElementById('shop-pagination');
        if (totalPages <= 1) { host.innerHTML = ''; return; }
        const cur = state.page;
        const btns = [];
        btns.push(`<button class="gh-pagination__btn" ${cur === 1 ? 'disabled' : ''} data-page="${cur - 1}">‹</button>`);
        const start = Math.max(1, cur - 2);
        const end = Math.min(totalPages, cur + 2);
        if (start > 1) {
          btns.push(`<button class="gh-pagination__btn" data-page="1">1</button>`);
          if (start > 2) btns.push(`<span class="gh-text-muted px-2">…</span>`);
        }
        for (let i = start; i <= end; i++) {
          btns.push(`<button class="gh-pagination__btn ${i === cur ? 'active' : ''}" data-page="${i}">${i}</button>`);
        }
        if (end < totalPages) {
          if (end < totalPages - 1) btns.push(`<span class="gh-text-muted px-2">…</span>`);
          btns.push(`<button class="gh-pagination__btn" data-page="${totalPages}">${totalPages}</button>`);
        }
        btns.push(`<button class="gh-pagination__btn" ${cur === totalPages ? 'disabled' : ''} data-page="${cur + 1}">›</button>`);
        host.innerHTML = btns.join('');
        host.querySelectorAll('button[data-page]').forEach(b => {
          b.addEventListener('click', () => {
            state.page = parseInt(b.dataset.page);
            window.scrollTo({ top: 0, behavior: 'smooth' });
            syncUrl();
            loadProducts();
          });
        });
      }

      async function loadCategories() {
        const host = document.getElementById('cat-list');
        let cats = [];
        try { cats = await Category.getAll(); } catch (_) {}
        cats = _extractList(cats);
        const allHtml = `<label><input type="radio" name="cat" value="" ${state.categoryId ? '' : 'checked'} /> Tất cả</label>`;
        host.innerHTML = allHtml + cats.map(c => {
          const id = c.Id || c.id;
          const name = c.Name || c.name;
          return `<label><input type="radio" name="cat" value="${id}" ${String(state.categoryId) === String(id) ? 'checked' : ''} /> ${name}</label>`;
        }).join('');
        host.querySelectorAll('input[name=cat]').forEach(input => {
          input.addEventListener('change', () => {
            state.categoryId = input.value;
            state.page = 1;
            syncUrl();
            loadProducts();
          });
        });
      }

      function syncUrl() {
        const params = new URLSearchParams();
        if (state.keyword)    params.set('keyword', state.keyword);
        if (state.categoryId) params.set('category', state.categoryId);
        if (state.sort && state.sort !== 'newest') params.set('sort', state.sort);
        if (state.page > 1)   params.set('page', state.page);
        const qs = params.toString();
        const url = qs ? `?${qs}` : window.location.pathname;
        window.history.replaceState({}, '', url);
      }

      function readUrl() {
        const params = new URLSearchParams(window.location.search);
        state.keyword    = params.get('keyword') || '';
        state.categoryId = params.get('category') || '';
        state.sort       = params.get('sort') || 'newest';
        state.page       = parseInt(params.get('page')) || 1;
        const section    = params.get('section');
        if (section === 'new' || section === 'best') state.sort = 'newest';
      }

      function debounce(fn, ms) {
        let t;
        return function (...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), ms); };
      }

      document.addEventListener('DOMContentLoaded', () => {
        mountLayout({ active: 'shop' });
        readUrl();
        loadCategories();
        loadProducts();

        const searchInput = document.getElementById('search-input');
        searchInput.value = state.keyword;
        searchInput.addEventListener('input', debounce(e => {
          state.keyword = e.target.value.trim();
          state.page = 1;
          syncUrl();
          loadProducts();
        }, 350));

        const sortSelect = document.getElementById('sort-select');
        sortSelect.value = state.sort;
        sortSelect.addEventListener('change', () => {
          state.sort = sortSelect.value;
          syncUrl();
          loadProducts();
        });

        document.getElementById('apply-price-btn').addEventListener('click', () => {
          const min = parseInt(document.getElementById('price-min').value);
          const max = parseInt(document.getElementById('price-max').value);
          state.priceMin = Number.isFinite(min) ? min : null;
          state.priceMax = Number.isFinite(max) ? max : null;
          state.page = 1;
          loadProducts();
        });

        document.getElementById('reset-filters').addEventListener('click', () => {
          state.keyword = '';
          state.categoryId = '';
          state.sort = 'newest';
          state.priceMin = null;
          state.priceMax = null;
          state.page = 1;
          searchInput.value = '';
          sortSelect.value = 'newest';
          document.getElementById('price-min').value = '';
          document.getElementById('price-max').value = '';
          document.querySelectorAll('input[name=cat]').forEach(r => r.checked = (r.value === ''));
          syncUrl();
          loadProducts();
        });

        document.querySelectorAll('.gh-shop__view-toggle button').forEach(b => {
          b.addEventListener('click', () => {
            document.querySelectorAll('.gh-shop__view-toggle button').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            const grid = document.getElementById('shop-grid');
            grid.classList.toggle('list-view', b.dataset.view === 'list');
          });
        });
      });
    </script>
  </body>
</html>
