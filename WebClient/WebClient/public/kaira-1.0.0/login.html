<!doctype html>
<html lang="vi">
  <head>
    <title>Đăng Nhập — GlowHub</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Marcellus&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/glowhub-theme.css" />
    <style>
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
      .shake-animation { animation: shake .2s ease-in-out 0s 2; }
      .is-invalid { border-color: var(--gh-danger) !important; }
      #login-error { color: var(--gh-danger); font-weight: 500; }
    </style>
  </head>

  <body>
    <div class="gh-auth-shell">
      <div class="gh-auth-card">
        <div class="gh-auth-card__brand"><a href="index.html" style="text-decoration:none;color:inherit">GLOWHUB</a></div>
        <h1 class="gh-auth-card__title">Đăng Nhập</h1>

        <form id="login-form">
          <label class="gh-label">Tên đăng nhập</label>
          <input type="text" id="username" class="gh-input mb-3" placeholder="Nhập username" required />

          <label class="gh-label">Mật khẩu</label>
          <input type="password" id="password" class="gh-input mb-2" placeholder="••••••••" required />

          <div id="login-error" class="small mt-1 mb-3" style="display:none">
            <span id="error-message"></span>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4" style="font-size:13px">
            <label class="d-flex gap-1 align-items-center"><input type="checkbox" /> Ghi nhớ</label>
            <a href="#" id="forgot-link" style="color:var(--gh-primary);text-decoration:none">Quên mật khẩu?</a>
          </div>

          <button type="submit" class="gh-btn gh-btn--dark gh-btn--block gh-btn--lg">Đăng Nhập</button>
        </form>

        <div class="gh-auth-card__foot">
          Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script>
      document.getElementById('forgot-link').addEventListener('click', e => {
        e.preventDefault();
        showGlobalToast('Tính năng đang phát triển', 'error');
      });
    </script>
  </body>
</html>
