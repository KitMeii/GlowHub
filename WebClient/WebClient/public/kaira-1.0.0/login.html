<!doctype html>
<html lang="en">
  <head>
    <title>Đăng nhập - GlowHub</title>
    <meta charset="utf-8" />
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" type="text/css" href="css/vendor.css" />
    <link rel="stylesheet" type="text/css" href="style.css" />

    <style>
      /* CSS nội bộ này sẽ đảm bảo nút hiện ra ngay cả khi file style.css bị lỗi */
      body {
        background-color: #fffdf9 !important;
        font-family: "Jost", sans-serif;
      }
      .login-page-wrapper {
        min-height: 90vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-card {
        background: #ffffff;
        border: 1px solid #eeeeee;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
      }
      .btn-login {
        background: #111111 !important; /* Ép màu đen */
        color: #ffffff !important;
        border: none;
        padding: 16px;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 14px;
        width: 100%;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
      }
      .btn-login:hover {
        background: #f759ab !important;
      }
      .form-control {
        border-radius: 0;
        padding: 12px;
        border: 1px solid #e1e1e1;
      }
      .form-label {
        font-family: "Marcellus", serif;
        text-transform: uppercase;
        font-size: 12px;
        font-weight: bold;
      }
      /* Hiệu ứng rung nhẹ khi báo lỗi */
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-5px);
        }
        75% {
          transform: translateX(5px);
        }
      }

      .shake-animation {
        animation: shake 0.2s ease-in-out 0s 2;
      }

      /* Làm ô input đỏ lên khi có lỗi */
      .is-invalid {
        border-color: #ff4d4f !important;
        box-shadow: 0 0 0 0.2rem rgba(255, 77, 79, 0.25) !important;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,700;1,300&family=Marcellus&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript
      ><link
        href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,700;1,300&family=Marcellus&display=swap"
        rel="stylesheet"
    /></noscript>
  </head>
  <body>
    <header class="py-4 border-bottom bg-white">
      <div class="container text-center">
        <a href="index.html" class="text-decoration-none">
          <h2
            class="text-black m-0"
            style="
              letter-spacing: 4px;
              font-family: &quot;Marcellus&quot;, serif;
            "
          >
            GLOWHUB
          </h2>
        </a>
      </div>
    </header>

    <div class="login-page-wrapper">
      <div class="login-card">
        <h2
          class="text-center mb-4"
          style="font-family: &quot;Marcellus&quot;, serif"
        >
          Đăng nhập
        </h2>

        <form id="login-form">
          <div class="mb-3">
            <label class="form-label">Tên đăng nhập</label>
            <input
              type="text"
              id="username"
              class="form-control"
              placeholder="Nhập username"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="••••••••"
              required
            />
            <div
              id="login-error"
              class="small mt-2"
              style="display: none; color: #ff4d4f; font-weight: 500"
            >
              <i class="bi bi-exclamation-circle me-1"></i>
              <span id="error-message"></span>
            </div>
          </div>

          <div class="d-flex justify-content-between mb-4 small">
            <label><input type="checkbox" /> Ghi nhớ</label>
            <a href="#" style="color: #f759ab" class="text-decoration-none"
              >Quên mật khẩu?</a
            >
          </div>

          <button type="submit" class="btn-login">Đăng nhập ngay</button>
        </form>

        <div class="text-center mt-4">
          <p class="small text-muted m-0">
            Chưa có tài khoản?
            <a
              href="register.html"
              style="color: #f759ab"
              class="fw-bold text-decoration-none"
              >Đăng ký ngay</a
            >
          </p>
        </div>
      </div>
    </div>

    <script src="js/jquery.min.js" defer></script>
    <script src="js/api.js" defer></script>
    <script>
      // Login form is handled by api.js (DOMContentLoaded on login.html)
    </script>
  </body>
</html>
